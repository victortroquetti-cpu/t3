; Trok Headmove -- a cabeca acompanhando para onde voce olha (o /headmove do SA-MP), sem o atraso do SA-MP.
; Mudou aqui? Vale na hora, com o jogo aberto: o mod confere este arquivo a cada segundo.
[headmove]
; 1 = ligado. 0 = a cabeca volta ao jeito do SA-MP.
ligado=1
; Seu personagem: quanto tempo (em ms) a cabeca leva para chegar onde a camera olha. 0 = na hora.
; (O SA-MP sozinho so muda a direcao da cabeca uma vez por segundo.)
atraso_ms=0
; Os outros jogadores, como VOCE os ve: 1 = o mod cuida deles tambem, 0 = como o SA-MP faz.
outros_jogadores=1
; Atraso deles (ms). A direcao deles chega pela rede aos pedacos: um pouco de atraso deixa o giro liso.
atraso_outros_ms=100
; Giro do GTA por quadro, de 0.1 (o do SA-MP, lento) a 1.0 (na hora). Com atraso 0, deixe 1.0.
giro=1.0
