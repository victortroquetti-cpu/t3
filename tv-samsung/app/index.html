<!DOCTYPE html>
<html>
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<title>Minha TV</title>

	<!-- Módulos da própria TV (Samsung 2013). Fora da TV não existem e o js/tv.js usa substitutos. -->
	<script type="text/javascript" src="$MANAGER_WIDGET/Common/API/Widget.js"></script>
	<script type="text/javascript" src="$MANAGER_WIDGET/Common/API/TVKeyValue.js"></script>
	<script type="text/javascript" src="$MANAGER_WIDGET/Common/API/Plugin.js"></script>
	<script type="text/javascript" src="$MANAGER_WIDGET/Common/webapi/1.0/webapis.js"></script>

	<!-- js/config.js é gerado pelo servidor do PC (endereço do PC, cidade, apps). -->
	<script type="text/javascript" charset="utf-8" src="js/config.js"></script>
	<script type="text/javascript" charset="utf-8" src="js/tv.js"></script>
	<script type="text/javascript" charset="utf-8" src="js/dados.js"></script>
	<script type="text/javascript" charset="utf-8" src="js/player.js"></script>
	<script type="text/javascript" charset="utf-8" src="js/home.js"></script>

	<link rel="stylesheet" type="text/css" href="css/home.css">
</head>
<body onload="Home.iniciar();" onunload="Home.encerrar();">
	<object id="pluginObjectNNavi" border="0" classid="clsid:SAMSUNG-INFOLINK-NNAVI" style="width:0;height:0;opacity:0;"></object>
	<object id="pluginObjectTVMW" border="0" classid="clsid:SAMSUNG-INFOLINK-TVMW" style="width:0;height:0;opacity:0;"></object>
	<object id="pluginObjectAppCommon" border="0" classid="clsid:SAMSUNG-INFOLINK-APPCOMMON" style="width:0;height:0;opacity:0;"></object>

	<!-- Na TV as teclas do controle chegam ao elemento com foco: esta âncora. -->
	<a href="javascript:void(0);" id="ancora" onkeydown="Home.tecla(event);"></a>

	<div id="tela">
		<div id="fundo"></div>
		<div id="veu"></div>

		<div id="topo">
			<div id="relogio">--:--</div>
			<div id="data"></div>
			<div id="clima">
				<div id="clima-icone"></div>
				<div id="clima-temp"></div>
				<div id="clima-texto"></div>
				<div id="clima-extra"></div>
			</div>
			<div id="aviso-pc"></div>
		</div>

		<div id="janela">
			<div id="linhas"></div>
		</div>

		<div id="dicas">Setas: navegar &nbsp;&middot;&nbsp; OK: abrir &nbsp;&middot;&nbsp; RETURN: voltar &nbsp;&middot;&nbsp; <span class="tecla-vermelha"></span> Vermelho: atualizar</div>

		<div id="detalhe">
			<div id="detalhe-fundo"></div>
			<div id="detalhe-veu"></div>
			<div id="detalhe-caixa">
				<div id="detalhe-titulo"></div>
				<div id="detalhe-info"></div>
				<div id="detalhe-sinopse"></div>
				<div id="detalhe-onde"></div>
				<div id="detalhe-botoes"></div>
			</div>
		</div>

		<div id="aviso"></div>
	</div>

	<!-- Tocador: o vídeo da TV fica por baixo da página; aqui só o painel por cima. -->
	<div id="tocador">
		<div id="tocador-video"></div>
		<div id="tocador-osd">
			<div id="tocador-topo">
				<span id="tocador-selo">AO VIVO</span>
				<span id="tocador-titulo"></span>
				<div id="tocador-sub"></div>
			</div>
			<div id="tocador-base">
				<div id="tocador-barra"><div id="tocador-progresso"></div></div>
				<div id="tocador-tempo"></div>
				<div id="tocador-dicas"></div>
			</div>
		</div>
		<div id="tocador-estado"></div>
	</div>
</body>
</html>
