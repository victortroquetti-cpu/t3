// Trok: modo Hordas (cooperativo contra hordas de zumbis por rodadas; design/modo-hordas.md).
// Executado sozinho quando o mapa começa com "trok_modo hordas" (depois do server.cfg e do
// balanceamento.cfg; o que muda aqui volta no próximo mapa de outro modo).
// Tipos por rodada, matilha, chefe, caixa e bônus: scripts/trok_hordas.txt.
// Níveis da máquina de melhoria: scripts/trok_upgrade.txt.
// No console: trok_hordas_info (tabela das rodadas 1-30 com estes números).
// PROPOSTA = número nosso (CoD/CA como referência); MEDIR = conferir jogando.

mp_teamplay 1
mp_friendlyfire 0
mp_fraglimit 0
mp_timelimit 0
hl2mp_bot_quota 0                       // os zumbis são do diretor; bots de cota tirariam vagas deles
trok_economia 0                         // o Hordas usa pontos próprios, não o dinheiro estilo CS
trok_morte_largar ""                    // ninguém larga arma ao morrer (a melhoria vai com a arma)

// --- Ritmo ---
trok_hordas_preparo 15                  // s antes da rodada 1
trok_hordas_intervalo 10                // s entre rodadas (CoD: ~10)
trok_hordas_fim 12                      // s mostrando o fim de jogo, depois recomeça da rodada 1
trok_hordas_dificuldade 0               // 0 normal, 1 difícil, 2 extremo (Equipe Armada do CA tem 3)
trok_hordas_dif_vida "1 1.2 1.5"        // x vida por dificuldade (CA: fator global 1,0 / 1,2 / 1,5)
trok_hordas_dif_dano "1 1.25 1.6"       // x dano dos zumbis (PROPOSTA)
trok_hordas_dif_quantidade "1 1.15 1.3" // x zumbis por rodada (PROPOSTA)

// --- Vida do zumbi normal (CoD: 150, +100 por rodada até a 9ª, depois x1,1 por rodada) ---
trok_hordas_vida_inicial 150
trok_hordas_vida_por_rodada 100
trok_hordas_vida_virada 10
trok_hordas_vida_fator 1.1
trok_hordas_vida_teto 0                 // 0 = sem teto (rodada 50 ~ 44 mil)
trok_hordas_vida_jogadores 0            // CA: +0,3 x log2(jogadores). 0 = só a quantidade sobe com gente

// --- Quantidade por rodada (fórmula do CoD: base 24 + 6 por jogador x fator da rodada) ---
trok_hordas_qtd_base 24
trok_hordas_qtd_por_jogador 6           // sozinho conta meio jogador
trok_hordas_qtd_inicio "0.25 0.3 0.5 0.7 0.9"   // rodadas 1 a 5 (solo: 6, 8, 13, 18, 24)
trok_hordas_qtd_teto 0
trok_hordas_vivos_base 10               // vivos ao mesmo tempo, 1 jogador (CoD: 24 sempre; Source pesa mais)
trok_hordas_vivos_por_jogador 4         // 4 jogadores: 22
trok_hordas_vivos_max 24                // e nunca mais que as vagas do servidor (maxplayers 32 recomendado)
trok_hordas_vagas_livres 1
trok_hordas_reuso_espera 1.5            // s morto antes de o bot voltar como outro zumbi

// --- Nascer ---
trok_hordas_nascer_intervalo 2          // s entre zumbis na rodada 1 (CoD: 2)
trok_hordas_nascer_fator 0.95           // x por rodada (CoD: 0,95)
trok_hordas_nascer_min 0.15
trok_hordas_nascer_longe 450            // u: não nasce colado num humano

// --- Velocidade (x a velocidade do tipo; 0,6 anda, ~1 corre) ---
trok_hordas_vel_inicial 0.6
trok_hordas_vel_por_rodada 0.06         // rodada 7 já corre; teto na 10ª
trok_hordas_vel_max 1.15
trok_hordas_vel_variacao 0.12           // cada zumbi +-12%

// --- Golpe do zumbi (as garras do Surto; no Surto o surto.cfg volta a 310) ---
trok_surto_garra_dano 40                // 100 de vida = 3 golpes (CoD: 2 a 3 sem colete). MEDIR

// --- Pontos (CoD clássico) ---
trok_hordas_pontos_inicio 500
trok_hordas_pontos_acerto 10
trok_hordas_pontos_abate 50
trok_hordas_pontos_cabeca 100
trok_hordas_pontos_faca 130
trok_hordas_pontos_reparo 10            // por tábua
trok_hordas_pontos_reparo_teto 500      // por rodada por jogador
trok_hordas_pontos_bonus_todos 400      // Ataque aéreo
trok_hordas_pontos_reforco 200          // Reforço
trok_hordas_perda_caido 0.05
trok_hordas_perda_morte 0.10

// --- Humanos ---
trok_vida 100
trok_armas_iniciais "weapon_trok_pistola weapon_trok_faca weapon_trok_granada"
trok_municao_inicial "Pistol 45"        // CoD: pistola com pouca reserva
trok_hordas_reserva_pentes 6            // reserva cheia = 6 pentes (x reserva do nível de melhoria)
trok_hordas_granadas_rodada 2           // +2 granadas a cada rodada (até o máximo)
trok_hordas_regen_espera 4              // s sem dano até a vida voltar
trok_hordas_regen 40                    // vida por segundo
trok_hordas_caido_tempo 30              // s derrubado até morrer (CoD: 30)
trok_hordas_caido_velocidade 0.35
trok_hordas_reviver_tempo 3             // s segurando E (CoD: 4; 2 com o perk)
trok_hordas_reviver_distancia 110
trok_hordas_reviver_vida 0.5
trok_hordas_kit_tempo 4                 // kit de reanimação (bancada): levanta sozinho em 4 s
trok_hordas_colete 100                  // armadura do colete da bancada
trok_hordas_aliados 0                   // bots aliados (0 = só jogadores)
trok_hordas_bot_dificuldade 1

// --- Estações ---
trok_hordas_usar_distancia 80              // igual ao alcance do E do motor (PLAYER_USE_RADIUS)
trok_hordas_caixa_preco 950             // CoD: 950
trok_hordas_caixa_barata_preco 10       // com o bônus Caixa barata (CoD: Fire Sale 10)
trok_hordas_caixa_giro 4
trok_hordas_caixa_oferta 10

// --- Bônus que caem ---
trok_hordas_bonus_chance 0.025          // por abate
trok_hordas_bonus_max 4                 // por rodada (CoD: 4)
trok_hordas_bonus_duracao 30            // Abate certo, Pontos em dobro, Caixa barata (CoD: 30 s)
trok_hordas_bonus_chao 25               // s no chão antes de sumir
