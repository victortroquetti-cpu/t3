// Trok: Corrida Armada (o "Arms Race" do Combat Arms; design/modos.md).
// Executado sozinho quando o mapa começa com "trok_modo corrida". Números do CA
// (design/chimera/specs/combat_arms/game_modes.md M14, S2, S5, S6, S10).
// A escada de armas fica em scripts/trok_corrida.txt.
mp_teamplay 0
mp_fraglimit 15             // meta: abates para vencer (CA: 15, 30 ou 45; padrão 15). Escolhe a escada
mp_timelimit 0              // CA: sem limite de tempo
trok_renascer_tempo 7       // s até renascer sozinho (CA: o cliente pede aos 7,0 s)
trok_protecao 4             // s de proteção ao nascer; acaba ao atirar (CA: 4,0 s sem dano)
trok_corrida_chance 80      // sorteio 0..100 abaixo disto = arma da escada; senão a sua da mesma classe (CA: 80)
trok_corrida_extras "weapon_trok_faca" // junto com a arma da escada (faca)
trok_corrida_saida_jogadores 2         // alguém sai e sobram 2 ou menos (contando quem saiu): acaba (CA)
trok_corrida_saida_fracao 0.1          // quem ficou vence se os abates da partida passam de 10% da meta (CA)
