// Rearmed: partida online com amigos (aberta na internet e sem trapaças).
//
// Servidor local (você joga e hospeda): no console, "exec online" e depois comece a partida pelo
// menu (JOGAR). Vale até fechar o jogo; para voltar ao modo de teste: lservercfgfile listenserver.cfg
// Servidor dedicado: abra o srcds com +servercfgfile online.cfg
// Guia: LEIA-ME.txt (JOGAR COM AMIGOS); completo no repositório em cs-source/design/jogar-online.md

// Daqui em diante, cada mapa do servidor local roda este arquivo no lugar do listenserver.cfg.
lservercfgfile online.cfg

// Mesma jogabilidade do teste (balanceamento e movimento)...
exec server

// ...mas sem os atalhos de desenvolvimento.
sv_cheats 0
developer 0
hostname "Rearmed"

// 0 = internet. Se todos estiverem na mesma rede (ou numa VPN como Radmin VPN, ZeroTier ou
// Tailscale), pode ser 1.
sv_lan 0

// Senha da sala: preencha para só os amigos entrarem. Eles digitam: password SENHA; connect IP
sv_password ""

// Mapas e arquivos do mod que o amigo não tiver são baixados do servidor.
sv_allowdownload 1
sv_allowupload 0

// Região do servidor na lista: 2 = América do Sul, 255 = mundo.
sv_region 2
