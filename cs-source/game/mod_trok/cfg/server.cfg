// Trok: configuração do servidor. Roda a cada mapa: no dedicado direto, no local pelo listenserver.cfg.
// Para jogar online com amigos, sem trapaças: exec online (ver online.cfg).
hostname "Rearmed (dev)"
sv_cheats 1
developer 1

// Bots do HL2MP (NextBot): a cota e o nível vêm do menu (JOGAR > CONTRA BOTS) ou do console
// (hl2mp_bot_quota, hl2mp_bot_difficulty). Não definir aqui, senão este arquivo apaga os bots
// que o menu acabou de pedir.

// Sem carregar caixas e objetos com E (coisa do HL2; o CA e o CoD não têm). O E continua abrindo grades.
hl2mp_allow_pickup 0

// Jogabilidade do Trok: vida, dano, armas iniciais e movimentação (o balanceamento executa o movimento.cfg).
exec balanceamento

// Série de abates como no Combat Arms (faixa, voz e lista) e economia estilo CS (desligada).
exec killstreak
exec economia
