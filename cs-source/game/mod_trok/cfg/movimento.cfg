// Trok: movimentação. No console: exec movimento
// Pontos de partida para ajustar jogando. A referência é a quarentena do
// Combat Arms: meça no seu jogo (tempo para correr uma distância conhecida,
// altura que o pulo alcança) e acerte os números aqui.

// ===========================================================================
// MOVIMENTO DO COMBAT ARMS (trok_mov_ca 1): o padrão.
// Números do CA de 2009 (design/decombat/specs/MOVEMENT_2009.md e specs do Chimera), em unidades
// do CA; o jogo converte com trok_ca_escala (1 = mesma escala: o mundo do CA tem 40u por metro, o do
// Source ~39). Com a M4: corrida ~231 u/s (CS:S: 221), sprint ~323, pulo ~50u de altura. Ver o
// comentário "Movimento do Combat Arms" em src/game/shared/trok/trok_gamemovement.cpp.
// Com trok_mov_ca 0 volta o movimento do Source com os ajustes da parte de baixo deste arquivo.
// ===========================================================================
trok_mov_ca 1
trok_ca_escala 1             // mesma escala de mundo (0.72 = converter pela altura do corpo, fica mais lento)
trok_ca_corrida 285          // correndo (frente, trás e lados iguais)
trok_ca_andar 70             // andando (C) e com luneta
trok_ca_agachado 50
trok_ca_sprint 1.4           // sprint = corrida x 1,4
trok_ca_colete 0.1           // perda do colete padrão (somada à arma: M4 0,10, MP5 0,07, R870 0,08, pistola 0,03, faca 0)
trok_ca_pulo 330             // velocidade do pulo; com a gravidade abaixo sobe ~50u e fica 0,6 s no ar
trok_ca_acel 3000            // aceleração por eixo
trok_ca_acel_inicio 500      // primeiro instante de um movimento (e ao trocar de sentido)
trok_ca_acel_max 3000
trok_ca_acel_rampa 6000      // 500 -> 3000 em ~0,4 s segurando a direção
trok_ca_atrito 5             // a velocidade cai como exp(-5t) no chão
trok_ca_parada 0.1           // soltar as teclas: para a corrida em 0,1 s
trok_ca_ar 0.1               // agachado no ar depois de pular: quase sem controle
trok_ca_ar_rampa 1           // no ar vale a mesma rampa do chão (controle forte, limitado à velocidade)
trok_ca_pulo_min 0.3         // depois de cada pulo: próximo pulo e aceleração a 30%...
trok_ca_pulo_recupera 1.2    // ...recuperando 1,2/s (volta ao normal em ~0,6 s)
trok_ca_agachar_tempo 0.15   // agachar completo (Source: 0,4)
trok_ca_agachar_ar 0.5       // no ar a caixa encolhe pelo centro: pés sobem metade da diferença
trok_ca_queda_min 300        // queda: sem dano até 300u do CA...
trok_ca_queda_max 700        // ...200 de dano em 700u (linear)
trok_ca_queda_dano 200
sv_gravity 1100              // gravidade do jogador no CA (x trok_ca_escala)
sv_stepsize 30               // degrau do CA: sobe 30u sem pular (Source: 18)
// O sprint usa o fôlego do HL2: estas velocidades só servem para o HL2 saber o estado
// (andando/correndo/sprint); a velocidade de verdade vem dos trok_ca_* acima.
hl2_walkspeed 63
hl2_normspeed 256
hl2_sprintspeed 359
trok_faca_velocidade 1.0     // no CA a faca não tem perda; as outras armas têm (scripts)
trok_escalar 0               // o CA não tem escalar bordas; 1 = liga o nosso (parkour extra)

// ===========================================================================
// MOVIMENTO DO SOURCE AJUSTADO (só vale com trok_mov_ca 0)
// ===========================================================================
// --- Velocidades (u/s) ---
// (trok_mov_ca 0) hl2_walkspeed 140           // andando quieto (+walk)
// (trok_mov_ca 0) hl2_normspeed 210           // corrida normal (HL2: 190)
// (trok_mov_ca 0) hl2_sprintspeed 300         // sprint (HL2: 320); gasta energia do traje

// --- Pulo ---
trok_pulo_altura 40         // u em pé (HL2: 21, CS:S: ~45). Agachado no ar alcança ~36u a mais.
trok_pulo_impulso_frente 0  // 1 = mantém o "bunny hop" acelerado do HL2

// --- Deslizar (sprint + agachar) ---
// Desligado: o dono não quer o deslize "try hard" do CoD. O código fica para um uso
// pontual (ex.: deslize curto sem ganho de velocidade) se um dia quiserem.
trok_deslizar 0
trok_deslizar_vel_min 240   // só começa acima disto (precisa estar correndo)
trok_deslizar_impulso 1.25
trok_deslizar_vel_max 400
trok_deslizar_atrito 0.15   // fração do atrito normal durante o deslize
trok_deslizar_vel_fim 160

// --- Escalar (segurar pular andando contra uma borda) ---
// (trok_mov_ca 0) trok_escalar 1
trok_escalar_altura_max 80  // u acima dos pés
trok_escalar_vel_frente 140

// --- Fluidez (pular de caixa em caixa, trocar de lado) ---
trok_ar_controle 40         // u/s de controle no ar (Source/CS: 30). Com a virada abaixo, não precisa ser alto
trok_pulo_virada 0.6        // logo depois do pulo, apertar outra direção gira a velocidade para ela (nunca acelera)
trok_pulo_virada_tempo 0.5  // janela (s) da virada depois do pulo
trok_pulo_coyote 0.12       // ainda pula até este tempo (s) depois de sair da borda andando
trok_pulo_antecipado 0.12   // apertou pular até este tempo (s) antes de pousar: pula ao pousar
trok_pulo_teto 1.4          // ao pular, acima de 1,4x a velocidade máxima o excesso cai (contra bunny hop)
trok_pulo_teto_duro 1.7
// (trok_mov_ca 0) trok_faca_velocidade 1.12   // com faca/arma branca na mão corre mais (CA)
sv_accelerate 12            // arranque e troca de lado no chão (HL2MP: 10)
sv_airaccelerate 15         // quão rápido o controle no ar atua (HL2MP: 10)
sv_friction 4.5             // parada (HL2MP: 4); mais alto = para e troca de lado mais seco

// --- Física geral ---
// (trok_mov_ca 0) sv_gravity 600

// Para comparar com o HL2MP puro:
//   trok_pulo_altura 21; trok_pulo_impulso_frente 1; trok_deslizar 0; trok_escalar 0
//   trok_ar_controle 30; trok_faca_velocidade 1; sv_accelerate 10; sv_airaccelerate 10; sv_friction 4
//   trok_pulo_virada 0; trok_pulo_coyote 0; trok_pulo_antecipado 0; trok_pulo_teto 0
