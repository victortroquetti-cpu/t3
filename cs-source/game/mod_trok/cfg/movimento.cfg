// Trok: movimentação. No console: exec movimento
// Pontos de partida para ajustar jogando. A referência é a quarentena do
// Combat Arms: meça no seu jogo (tempo para correr uma distância conhecida,
// altura que o pulo alcança) e acerte os números aqui.

// --- Velocidades (u/s) ---
hl2_walkspeed 140           // andando quieto (+walk)
hl2_normspeed 210           // corrida normal (HL2: 190)
hl2_sprintspeed 300         // sprint (HL2: 320); gasta energia do traje

// --- Pulo ---
trok_pulo_altura 40         // u em pé (HL2: 21, CS:S: ~45). Agachado no ar alcança ~36u a mais.
trok_pulo_impulso_frente 0  // 1 = mantém o "bunny hop" acelerado do HL2

// --- Deslizar (sprint + agachar) ---
// Desligado: o dono não quer o deslize "try hard" do CoD. O código fica para um uso
// pontual (ex.: deslize curto sem ganho de velocidade) se um dia quiserem.
trok_deslizar 0
trok_deslizar_vel_min 240   // só começa acima disto (precisa estar correndo)
trok_deslizar_impulso 1.25
trok_deslizar_vel_max 400
trok_deslizar_atrito 0.15   // fração do atrito normal durante o deslize
trok_deslizar_vel_fim 160

// --- Escalar (segurar pular andando contra uma borda) ---
trok_escalar 1
trok_escalar_altura_max 80  // u acima dos pés
trok_escalar_vel_frente 140

// --- Fluidez (pular de caixa em caixa, trocar de lado) ---
trok_ar_controle 40         // u/s de controle no ar (Source/CS: 30). Com a virada abaixo, não precisa ser alto
trok_pulo_virada 0.6        // logo depois do pulo, apertar outra direção gira a velocidade para ela (nunca acelera)
trok_pulo_virada_tempo 0.5  // janela (s) da virada depois do pulo
trok_pulo_coyote 0.12       // ainda pula até este tempo (s) depois de sair da borda andando
trok_pulo_antecipado 0.12   // apertou pular até este tempo (s) antes de pousar: pula ao pousar
trok_pulo_teto 1.4          // ao pular, acima de 1,4x a velocidade máxima o excesso cai (contra bunny hop)
trok_pulo_teto_duro 1.7
trok_faca_velocidade 1.12   // com faca/arma branca na mão corre mais (CA)
sv_accelerate 12            // arranque e troca de lado no chão (HL2MP: 10)
sv_airaccelerate 15         // quão rápido o controle no ar atua (HL2MP: 10)
sv_friction 4.5             // parada (HL2MP: 4); mais alto = para e troca de lado mais seco

// --- Física geral ---
sv_gravity 600

// Para comparar com o HL2MP puro:
//   trok_pulo_altura 21; trok_pulo_impulso_frente 1; trok_deslizar 0; trok_escalar 0
//   trok_ar_controle 30; trok_faca_velocidade 1; sv_accelerate 10; sv_airaccelerate 10; sv_friction 4
//   trok_pulo_virada 0; trok_pulo_coyote 0; trok_pulo_antecipado 0; trok_pulo_teto 0
