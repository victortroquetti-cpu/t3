// Trok: modo Surto (infecção, sucessor da quarentena do Combat Arms).
// Executado sozinho quando o mapa começa com "trok_modo surto". Números de partida:
// medir na quarentena do Combat Arms (Claude Code local com o jogo instalado) e ajustar aqui.
// Fontes do que já se sabe: design/modo-surto.md.

mp_teamplay 1
mp_friendlyfire 0
mp_fraglimit 0

// --- Rodada ---
trok_surto_preparo 20                   // s todos humanos antes do sorteio (CA: 20 s)
trok_surto_tempo 160                    // s de rodada depois do sorteio (CA: 2:40)
trok_surto_alarme 80                    // faltando N s toca o alarme (relato do dono: 1:20)
trok_surto_abrigos 60                   // faltando N s os abrigos abrem (relato do dono: 1:00)
trok_surto_fim 8                        // s mostrando o vencedor (e o destaque da rodada)
trok_surto_assistir 3                   // s depois de morrer para assistir os vivos
trok_surto_min_jogadores 2

// --- Infectados ---
trok_surto_jogadores_por_hospedeiro 8   // CA: 1 a 3 hospedeiros conforme o número de jogadores (MEDIR a regra exata)
trok_surto_hospedeiros_max 3
trok_surto_vida_hospedeiro 300          // CA: 200–400 conforme o colete (Medium/Combat 300/200). Cada tipo
trok_surto_vida_zumbi 200               // de zumbi tem a vida dele em scripts/trok_zumbis.txt (estes valem se o tipo não disser)
trok_surto_virar_tempo 2                // s até o humano morto levantar zumbi
trok_surto_virar_no_lugar 1
trok_surto_zumbi_renasce 0              // zumbi morto fica morto: humanos também vencem matando todos
trok_surto_regen 0.10                   // CA: 10% da vida máxima...
trok_surto_regen_intervalo 1            // ...por segundo...
trok_surto_regen_espera 3               // ...depois de 3 s parado; andar, atacar ou levar dano recomeça (Chimera M8)
trok_surto_zumbi_sem_critico 1          // CA: infectado não leva crítico na cabeça
trok_surto_zumbi_pulo 1                 // CA: o infectado pula igual ao humano (Chimera: sem bônus de pulo)
trok_surto_zumbi_velocidade 1.1         // MEDIR
trok_surto_zumbi_folego 2               // CA: infectado tem o dobro de fôlego
trok_surto_garra_dano 310               // CA: um golpe de garra infecta na hora (mais de 300 de dano)

// --- Tipos de zumbi (scripts/trok_zumbis.txt; mutagênicos do CA e infectados da Equipe Armada) ---
trok_zumbis_tipos 1                     // cada jogador escolhe com a tecla N (trok_zumbi_classe_prox) ou trok_zumbi_classe <nome>
trok_surto_garra_alcance 70
trok_surto_garra_cadencia 0.45

// --- Tiro segura e empurra o zumbi (por arma: "empurrao" e "segurar" no script) ---
trok_surto_empurrao 1
trok_surto_empurrao_max 450
// Com o movimento do CA (trok_mov_ca 1) vale o empurrão do CA: por K s, sem correr, a aceleração
// vira K² (1 - t) na direção do tiro; agachado andando x0,25, agachado parado não sai do lugar.
// Bala: "ca_empurrao" (K) e "ca_empurrao_tempo" (s) no script da arma. Explosão: abaixo (M67).
trok_surto_ca_granada_empurrao 135
trok_surto_ca_granada_tempo 0.4

// --- Bots ---
trok_bot_zumbi_faro 1
trok_bot_zumbi_grupo 3                  // zumbis juntam este tanto antes de atacar um abrigo trancado
trok_bot_zumbi_grupo_espera 10
trok_bot_recuo_dist 380
