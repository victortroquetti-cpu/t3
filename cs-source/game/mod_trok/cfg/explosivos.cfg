// Trok: granadas e explosivos do Combat Arms (Chimera, design/chimera/specs/combat_arms/
// grenades.md e special_weapons.md). No console: exec explosivos (o balanceamento.cfg já executa).
// Os números de CADA explosivo ficam no bloco "TrokExplosivo" de scripts/weapon_trok_*.txt
// (pavio, velocidade, dano, raio, tempos do arremesso...). Aqui ficam as regras que valem para
// todos. Distâncias e velocidades em unidades do CA, multiplicadas por trok_ca_escala.
// O dano e o raio da granada de mão (M67) são trok_granada_dano / trok_granada_raio
// (balanceamento.cfg); a cobertura das explosões é trok_explosao_ca.

// --- Voo (grenades.md seções 5 e 6) ---
trok_explosivo_gravidade 1600      // gravidade de objeto do CA (não é a do jogador, 1100)
trok_explosivo_passo_ca 0.05       // passo fixo do voo: 20 quadros/s do servidor do CA (arco e rolar iguais ao CA)
trok_explosivo_dureza 0.65         // quique: fração da velocidade que fica (quase toda superfície do CA)
trok_explosivo_dureza_grade 0.5    // grade / tela de arame
trok_explosivo_dureza_areia 0.65   // CA: areia do deserto 0,1; o CS:S usa "sand" em quase todo chão do de_dust
trok_explosivo_dureza_agua 0.1     // superfície de líquido / lama
trok_explosivo_parada 50           // no chão, abaixo disso (u/s na horizontal) para seco
trok_explosivo_chao 0.75           // normal acima disso = chão (~41 graus)
trok_explosivo_corpo_dureza 0.65   // atravessar um corpo tira 35% da velocidade...
trok_explosivo_corpo_toques 2      // ...duas vezes por passo (caixa e hitbox do CA)
trok_explosivo_agua_gravidade 200  // dentro da água
trok_explosivo_agua_viscosidade 0.035

// --- Arremesso ---
trok_explosivo_correndo_vel 230    // correndo (Shift) acima disso o arremesso não começa (CA)

// --- Quanto cada um carrega (CA MaxAmount; ao nascer vem o default_clip do script) ---
trok_max_granada 1
trok_max_granada_luz 2
trok_max_granada_fumaca 2
trok_max_mina 3
trok_max_claymore 2
trok_max_remota 2
trok_max_torreta 1

