// Trok: teste rápido dos bots. No console: exec bots
// Precisa de nav mesh no mapa (nav_generate, depois nav_analyze para visibilidade e cobertura).
sv_cheats 1
mp_teamplay 1
hl2mp_bot_difficulty 2		// 0 facil, 1 normal, 2 dificil, 3 expert (vale para os próximos bots)
hl2mp_bot_quota 8
hl2mp_bot_quota_mode fill

// Ferramentas de depuração (mire num bot e use nb_select antes):
//   nb_debug BEHAVIOR             pilha de ações (TrokCerebro > SegurarPosicao / SeekAndDestroy)
//   trok_bot_debug_percepcao 1    barra de percepção sobre cada inimigo
//   trok_bot_debug_mira 1         ponto de mira e erro em graus
//   trok_bot_tatico_mostrar 2000  pinta o nav pela nota tática (verde = bom para segurar)
//   trok_bot_tatico_info          lista as regiões mais defensáveis
