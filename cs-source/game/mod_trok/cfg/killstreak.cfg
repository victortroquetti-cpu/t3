// Trok: série de abates (killstreak) como no Combat Arms. Executado pelo server.cfg.
// Regras: design/chimera/specs/combat_arms/kill_streaks.md. Textos, vozes, níveis e tempos da
// faixa ficam em scripts/trok_anunciador.txt (no console: trok_serie_recarregar).
// Teste sem matar ninguém: trok_serie_teste 2 cabeca  /  trok_serie_teste 1 primeiro  /  trok_serie_teste 1 abates 12
// Estatísticas do mapa no console do servidor: trok_serie_info

trok_serie 1                // 0 = desliga a contagem e os anúncios
trok_serie_janela 5         // s: abate a MENOS disso do anterior sobe o multi-abate (CA: 5)
trok_serie_vinganca 2       // vingança: abater quem te abateu N vezes sem resposta (0 = desliga). CA: não medido
trok_serie_primeiro 2       // primeiro abate: 0 desliga, 1 do mapa, 2 de cada rodada nos modos de rodada
trok_serie_sorte 0          // chance (0 a 1) de "tiro de sorte" (CA: vem do lobby, valor desconhecido)
trok_serie_voz 1            // voz do anunciador (sons provisórios do HL2/CS:S). 0 = só a faixa
