// Trok: economia estilo CS (base; o dono termina). Executado pelo server.cfg. Ver design/economia.md.
// Itens e preços: scripts/trok_loja.txt. Comprar: tecla B (menu) ou trok_comprar <id>; lista: trok_loja_lista.
// Teste com sv_cheats 1: trok_dinheiro_teste 10000

trok_economia 0                     // 1 = liga (começa só com pistola, compra no tempo e na zona)
trok_economia_inicial 800           // dinheiro de quem entra no mapa (CS:S 800)
trok_economia_teto 16000            // máximo (CS:S 16000)
trok_economia_tempo_compra 20       // s depois de nascer em que dá para comprar (CS:S: 6 + 90)
trok_economia_area 1                // 1 = só na zona de compra do mapa (func_buyzone) ou perto de onde nasceu
trok_economia_raio 600              // mapa sem zona de compra: distância (u) de onde nasceu
trok_economia_aliado -3300          // abater aliado (CS:S -3300)
trok_economia_vitoria 3000          // rodada ganha (CS:S, eliminação num mapa sem objetivo)
trok_economia_derrota 1400          // rodada perdida (CS:S)
trok_economia_derrota_passo 500     // a mais por derrota seguida (CS:S)
trok_economia_derrota_max 3400      // teto do bônus de derrota (CS:S)
trok_economia_sobreviver 0          // a mais para quem termina a rodada vivo (CS:S: 0)
trok_economia_armas_iniciais "weapon_trok_pistola weapon_trok_faca"
trok_economia_municao_inicial "Pistol 30"
trok_economia_largar 1              // arma trocada cai no chão (CS:S); 0 = some
trok_economia_manter 1              // sobreviveu à rodada: fica com o que comprou (CS:S)
