// Trok: teclas padrão (usado quando ainda não existe config.cfg).
// Movimento no estilo Combat Arms: Shift corre (sprint), C caminha em silêncio.
unbindall

bind "w" "+forward"
bind "s" "+back"
bind "a" "+moveleft"
bind "d" "+moveright"
bind "SPACE" "+jump"
bind "CTRL" "+duck"
bind "SHIFT" "+speed"          // correr: arma abaixa, não atira
bind "c" "+walk"               // caminhar: devagar e sem barulho de passo
bind "e" "+use"                // usar; mirando numa arma no chão, troca pela sua (como no CA). Sem tecla de largar.
bind "r" "+reload"
bind "f" "impulse 100"         // lanterna

bind "MOUSE1" "+attack"
bind "MOUSE2" "+attack2"       // mira pelo cano (iron sight)
// Rodinha: como no CA, não troca de arma (o jogador pode pôr slot/lastinv nela no menu de teclas).
// Classes do CA: 1 principal, 2 secundária, 3 faca, 4 arremesso, 5 especial, 6 objetivo;
// repetir a tecla passa para a próxima arma da mesma classe.
bind "1" "slot1"
bind "2" "slot2"
bind "3" "slot3"
bind "4" "slot4"
bind "5" "slot5"
bind "6" "slot6"
bind "b" "trok_loja"           // menu de compra (só com a economia ligada, trok_economia 1)
bind "q" "lastinv"

bind "TAB" "+showscores"
bind "y" "messagemode"
bind "u" "messagemode2"
bind "m" "trok_menu_time"        // escolher time (só no mata-mata em equipe)
bind "n" "trok_zumbi_classe_prox" // Surto: tipo de zumbi para quando você virar (normal, Striker, Crusher...)
bind "`" "toggleconsole"
bind "ESCAPE" "cancelselect"
bind "F5" "jpeg"
bind "F10" "quit prompt"
bind "PAUSE" "pause"

// Sensibilidade menor mirando pelo cano (proporcional ao zoom).
zoom_sensitivity_ratio 1.0
