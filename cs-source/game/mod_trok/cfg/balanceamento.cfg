// Trok: TODOS os números de jogabilidade num lugar só. No console: exec balanceamento
// (o server.cfg já executa). Os valores abaixo são pontos de partida: a referência é o
// Combat Arms (quarentena) e depois o CoD. Meça no jogo de referência e preencha aqui.
// Armas: cada uma tem os números no bloco "Trok" de scripts/weapon_trok_*.txt.

// --- Jogador ---
trok_vida 100                 // vida ao nascer
trok_colete 0                 // colete (armadura) ao nascer
mp_falldamage 1               // 0 = fixo 10, 1 = proporcional à queda

// Dano por parte do corpo (multiplicadores do HL2; valem para as armas do Trok também)
sk_player_head 3
sk_player_chest 1
sk_player_stomach 1
sk_player_arm 1
sk_player_leg 1

// --- Equipamento ao nascer ---
trok_armas_iniciais "weapon_trok_fuzil weapon_trok_pistola weapon_crowbar"
trok_municao_inicial "SMG1 180 Pistol 72 Buckshot 24"

// --- Armas (regras gerais; o resto é por arma, no script) ---
trok_arma_correndo_atraso 0.2   // s até atirar depois de parar de correr
trok_arma_correndo_vel 230      // u/s: acima disso, segurando Shift, conta como correndo

// --- Movimento: ver cfg/movimento.cfg (velocidades, pulo, deslizar, escalar) ---
exec movimento
