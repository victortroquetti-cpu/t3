// Trok: TODOS os números de jogabilidade num lugar só. No console: exec balanceamento
// (o server.cfg já executa). Os valores abaixo são pontos de partida: a referência é o
// Combat Arms (quarentena) e depois o CoD. Meça no jogo de referência e preencha aqui.
// Armas: cada uma tem os números no bloco "Trok" de scripts/weapon_trok_*.txt.

// --- Jogador ---
trok_vida 100                 // vida ao nascer
trok_colete 0                 // colete (armadura) ao nascer
mp_falldamage 1               // 0 = fixo 10, 1 = proporcional à queda

// Dano por parte do corpo (multiplicadores do HL2; valem para as armas do Trok também)
// CA (weapon_firing.md, Hit zones): cabeça x6, tronco x1, braços x0,9, coxa x0,9 (canela 0,75 e pé 0,5:
// o Source tem uma parte só para a perna). Valem para bala e faca.
sk_player_head 6
sk_player_chest 1
sk_player_stomach 1
sk_player_arm 0.9
sk_player_leg 0.9

// --- Equipamento ao nascer ---
trok_armas_iniciais "weapon_trok_fuzil weapon_trok_pistola weapon_trok_faca"
// Reserva do CA (total menos o pente): M4A1/MP5A4 90, M92FS 30, R870 28.
trok_municao_inicial "SMG1 90 Pistol 30 Buckshot 28"

// --- Armas (regras gerais; o resto é por arma, no script) ---
trok_arma_correndo_atraso 0.2   // s até atirar depois de parar de correr
trok_arma_correndo_vel 230      // u/s: acima disso, segurando Shift, conta como correndo
trok_recuo_fixo 0.5             // modelo antigo: parte do recuo que fica na mira; o resto volta sozinho
trok_arma_ca 1                  // armas com "modelo_ca" 1 seguem a lei de tiro do CA (números no bloco "CA" do script)
trok_ca_dano_costas 1.3         // CA: tiro e faca vindos de trás (setor de 150 graus) x1,3
// Saída da corrida por arma: "saida_corrida" no script (M4A1 0,367; M92FS 0,4); sem o campo vale trok_arma_correndo_atraso.

// --- Inventário como no CA (shared/trok/trok_inventario.cpp) ---
// Teclas 1-6 = classes (1 principal, 2 secundária, 3 faca, 4 arremesso, 5 especial, 6 objetivo); Q = anterior.
trok_pegar_distancia 100        // E pega a arma do chão que está na mira até esta distância (u)
trok_pegar_encostando 0         // 0 = não pega andando por cima (CA)
trok_pegar_trocar "1 2"         // classes em que pegar troca pela sua (a sua cai no lugar com a munição)
trok_morte_largar "1 2"         // classes que caem ao morrer (principal e secundária, cada uma com a munição)
trok_arma_chao_tempo 20         // s até a arma no chão sumir
trok_armas_max 16               // máximo de armas carregadas

// --- Movimento: ver cfg/movimento.cfg (velocidades, pulo, deslizar, escalar) ---
exec movimento

// --- Explosões como no Combat Arms (Chimera grenades.md) ---
// Parede/pilastra do mapa protege; gente, prop solto ou granada no caminho não.
// Dano cheio até 25% do raio, depois cai até 0 no raio. Dá para fazer o "olé" atrás da pilastra.
trok_explosao_ca 1
trok_explosao_ca_nucleo 0.25
trok_granada_dano 120          // M67 do CA: 60 aplicado duas vezes
trok_granada_raio 450          // M67 do CA (o HL2 usa 250)

// --- Espectador ---
trok_espectador_livre 0        // sem câmera livre: só primeira ou terceira pessoa
